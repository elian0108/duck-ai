services:
  duckai:
    build:
      context: .
      dockerfile: Dockerfile
    image: duckai-gateway:latest
    container_name: duckai
    restart: unless-stopped
    init: true
    # Memória compartilhada essencial para evitar crashes de abas do Chrome
    shm_size: '2gb'
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - POOL_SIZE=${POOL_SIZE:-2}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-deepseek-chat}
      - DAILY_QUOTA=${DAILY_QUOTA:-150}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-60000}
      - HEADLESS=true
      - API_KEY=${API_KEY:-}
    volumes:
      # Persistência das métricas diárias e contagem de tokens entre restarts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
